[workspace]
resolver = "2"
members = [
    "crates/sybil",
    "crates/lib",
    "crates/indexer",
    "crates/querier",
    "crates/steward",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Rugwiro Mbanda Valentin"]

[workspace.dependencies]
# CLI
clap = { version = "4.0", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# IDs and timestamps
ulid = { version = "1.1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Compression and checksums
zstd = "0.13"
crc32fast = "1.4"

# HTTP
axum = "0.8"

# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
bytes = "1.0"

# Concurrency
parking_lot = "0.12"
crossbeam = "0.8"

# Storage
object_store = { version = "0.11", features = ["aws"] }
url = "2.5"
futures = "0.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Testing
tempfile = "3.10"

# Internal crates
lib = { path = "crates/lib" }
indexer = { path = "crates/indexer" }
querier = { path = "crates/querier" }
steward = { path = "crates/steward" }
