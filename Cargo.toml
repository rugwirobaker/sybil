[workspace]
resolver = "2"
members = [
    "crates/sybil",
    "crates/lib",
    "crates/indexer",
    "crates/querier",
    "crates/steward",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Rugwiro Mbanda Valentin"]

[workspace.dependencies]
# CLI
clap = { version = "4.0", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Internal crates
lib = { path = "crates/lib" }
indexer = { path = "crates/indexer" }
querier = { path = "crates/querier" }
steward = { path = "crates/steward" }
