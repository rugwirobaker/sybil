# Sybil configuration example

[storage]
endpoint = "https://fly.storage.tigris.dev"
bucket = "sybil"
region = "auto"

[server]
host = "0.0.0.0"
port = 8080

[indexer]
# Maximum time before flushing buffer to S3 (seconds)
flush_interval_secs = 10
# Target L0 segment size threshold (bytes).
# 48KB leaves headroom for dictionary, blooms, and footer so final segments
# stay ≤64KB to benefit from Tigris object inlining.
segment_size_bytes = 49152  # 48KB

[querier]
# NVMe cache directory path
cache_dir = "/var/cache/sybil"
# Maximum cache size (bytes)
cache_size_bytes = 10737418240  # 10GB

[steward]
# L0 segment count threshold for compaction
compaction_threshold = 10
# Number of concurrent worker tasks
worker_count = 10
